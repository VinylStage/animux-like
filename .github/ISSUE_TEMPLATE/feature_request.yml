name: ✨ 기능 제안
description: 새로운 기능이나 개선 사항을 제안해 주세요
title: "[기능] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        좋은 아이디어를 공유해 주셔서 감사합니다!

  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 어떤 불편함이나 아쉬운 점이 있으신가요?
      placeholder: 예) 새로운 동물 종류가 있으면 좋겠어요.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 어떻게 구현되면 좋을지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 (선택)
      description: 다른 방법도 고려해 보셨나요?

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보 (선택)
      description: 스크린샷, 참고 링크 등 추가 정보가 있으면 공유해 주세요.
